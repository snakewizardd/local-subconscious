<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subconscious Explorer</title>
    <!-- Vis.js for Network Graph -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar for the chronological feed and details -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Subconscious Feed</h2>
                <div class="controls">
                    <label for="threshold-slider">Link Threshold: <span id="threshold-val">0.5</span></label>
                    <input type="range" id="threshold-slider" min="0.1" max="0.99" step="0.05" value="0.5">
                </div>
            </div>
            
            <div id="thought-details" class="thought-details hidden">
                <h3>Selected Thought</h3>
                <p id="selected-text"></p>
                <button id="close-details">Clear Selection</button>
            </div>

            <div id="feed" class="feed">
                <!-- Thoughts will be injected here via JS -->
            </div>
        </aside>

        <!-- Main graph visualization area -->
        <main class="graph-container">
            <div id="network-graph"></div>
        </main>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
